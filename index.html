<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Query Pulse</title>
    <script>
      // Apply the saved (or the operating system's) look before first paint, so there is no
      // flash of the wrong theme. features/theme/theme.ts keeps it in step afterwards.
      (() => {
        try {
        const saved = JSON.parse(localStorage.getItem("qp-theme") || "null") || {};
        const mode =
          saved.mode === "light" || saved.mode === "dark"
            ? saved.mode
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const root = document.documentElement;
        if (mode === "dark") root.classList.add("dark");
        if (saved.palette === "lagoon" || saved.palette === "dusk") root.dataset.palette = saved.palette;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
